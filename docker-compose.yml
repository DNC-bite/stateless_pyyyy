# Base de datos MySQL para desarrollo:  docker compose up -d
# Usa el puerto 3307 para no chocar con XAMPP (3306). Los datos viven en el volumen "stateless_mysql".
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stateless_db
      MYSQL_USER: stateless
      MYSQL_PASSWORD: cambia-esta-clave      # debe coincidir con DB_PASSWORD de tu .env
      MYSQL_ROOT_PASSWORD: cambia-la-root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - stateless_mysql:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  stateless_mysql:
