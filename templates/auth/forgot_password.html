{% extends "base_guest.html" %}
{% block title %}Recuperar clave — STATELESS{% endblock %}
{% block content %}
<h2>RECUPERAR CLAVE</h2>
<p class="subtitle">Te enviaremos un link de recuperación</p>

<form method="post" action="{% url 'olvide_clave' %}">
    {% csrf_token %}
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" class="form-control" type="email" placeholder="tucorreo@ejemplo.com"
           value="{{ form.email.value|default:'' }}" autocomplete="email" required autofocus>
    {% for e in form.email.errors %}<div class="sl-field-error">{{ e }}</div>{% endfor %}

    <button type="submit" class="btn-stateless">ENVIAR ENLACE</button>

    <p class="text-center mt-4" style="font-size:11px; color:rgba(255,255,255,0.5);">
        <a href="{% url 'login' %}">← Volver a iniciar sesión</a>
    </p>
</form>
{% endblock %}
