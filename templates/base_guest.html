{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}STATELESS — Autenticación{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/guest.css' %}" rel="stylesheet">
</head>
<body>
    <canvas id="wavesCanvas"></canvas>

    <div class="auth-brand"><a href="{% url 'home' %}">STATELESS</a></div>

    <div class="min-vh-100 d-flex justify-content-center align-items-center py-5 auth-wrap">
        <div class="auth-card">
            {% for message in messages %}
                <div class="alert sl-alert-{% if message.level_tag == 'error' %}error{% elif message.level_tag == 'success' %}success{% elif message.level_tag == 'warning' %}warning{% else %}info{% endif %}">{{ message }}</div>
            {% endfor %}
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="{% static 'js/waves-canvas.js' %}"></script>
</body>
</html>
